<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedCare EMR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <!-- Header -->
  <header class="bg-white shadow p-4 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-500 p-2 rounded-full"></div>
      <div>
        <h1 class="text-xl font-bold">MedCare EMR</h1>
        <p class="text-sm text-gray-500">Electronic Medical Records</p>
      </div>
    </div>
    <nav class="space-x-4">
      <!-- <a href="/home" class="text-blue-600 font-medium">Dashboard</a>
      <a href="/patients/create-patients">Patients</a>
      <a href="/encounters">Encounters</a>
      <a href="/reports">Reports</a> -->

              <!-- Show current logged in user -->
    {% if user.is_authenticated %}
      <span class="ml-4 text-gray-700">Hello Dr. {{ user.username }} 👋</span>
      <a href="{% url 'logout' %}" class="ml-2 text-red-500">Logout</a>
    {% else %}
      <a href="{% url 'login' %}" class="ml-4 text-blue-500">Login</a>
    {% endif %}
    </nav>
  </header>

  <!-- Main -->
  <main class="p-6">
    {% block contentz %}
    <!-- Each page will inject its content here -->
    {% endblock %}
    </main>

  <!-- Footer -->
  <footer class="bg-white shadow p-4 text-center text-sm text-gray-500">
    &copy; 2025 MedCare EMR. All rights reserved.
  </footer>
</body>
</html>
