{% extends "authenticator/base.html" %}

{% block title %}Search Patient{% endblock %}

{% block contentz %}
<div class="max-w-md mx-auto mt-10">

  <!-- Search Section -->
  <div class="bg-white shadow rounded-lg p-6 text-center">
    <h2 class="text-xl font-semibold mb-4">Search Patient</h2>
    
    <form method="get" action="{% url 'patient_search' %}" class="space-y-4">
      <input type="text" 
             name="identifier" 
             placeholder="Enter Patient ID or Name"
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      
      <button type="submit" 
              class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
        Search
      </button>
    </form>
  </div>

  <!-- Result Section -->
  {% if patient %}
    <div class="mt-6 bg-green-100 border border-green-300 text-green-800 rounded-lg p-4 text-center">
      Found: 
      <a href="{% url 'patient_history' patient.id %}" class="font-medium text-blue-600 hover:underline">
        {{ patient }}
      </a>
    </div>
  {% elif request.GET %}
    <div class="mt-6 bg-red-100 border border-red-300 text-red-800 rounded-lg p-4 text-center">
      No patient found for 
      <span class="font-semibold">"{{ request.GET.identifier }}"</span>
    </div>
  {% endif %}

</div>
{% endblock %}
