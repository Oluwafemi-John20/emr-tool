{% extends "authenticator/base.html" %}
{% block title %}Register Patient{% endblock %}
{% load crispy_forms_tags %}
{% block contentz %}

<!-- Search existing patient -->
<div class="bg-white shadow rounded-lg p-6 max-w-lg mx-auto mb-6">
  <h3 class="text-lg font-semibold mb-4 text-center">Search Existing Patient</h3>
  <form method="get" action="{% url 'patient_search' %}" class="flex flex-col items-center space-y-3">
    <input type="text" name="identifier" placeholder="Enter Patient ID or Name"
           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
    <button type="submit"
            class="w-full py-2 px-4 bg-blue-600 text-white rounded hover:bg-blue-700">
      Search
    </button>
  </form>
</div>

<!-- Register new patient -->
<div class="bg-white shadow rounded-lg p-6 max-w-lg mx-auto mb-6">
    <h3 class="text-lg font-semibold mb-4 text-center">Register New Patient</h3>
  <form method="post" class="space-y-6 max-w-2xl mx-auto bg-white p-6 shadow rounded-lg">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded hover:bg-blue-700">
          Register
      </button>
  </form>
</div>

{% endblock %}
